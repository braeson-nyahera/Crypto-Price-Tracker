services:
  db:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_NAME: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
      DB_HOST: db
    command:
      [
        "--symbol",
        "${symbols:-BTCUSDT}",
        "--currency",
        "${currency:-KES}",
        "--output",
        "${output:-postgres}",
      ]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: